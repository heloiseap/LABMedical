<div class="pesquisa">
  <label for="nomePesquisa"><h3>Pesquisa por pacientes</h3></label>
  <input
    type="text"
    placeholder="Nome, telefone ou email"
    [(ngModel)]="pesquisa"
    id="nomePesquisa"
  />
  <div>
    <div>
      <button class="btn-normal" (click)="buscarPaciente()">
        Buscar paciente
      </button>
      <button class="btn-normal" (click)="limparPesquisa()">
        Limpar pesquisa
      </button>
      <button class="btn-normal" (click)="mostrarTodos()">Mostrar Todos</button>
    </div>
  </div>
</div>
<div>
  <div class="pacientes" *ngIf="this.mostrar">
    <div class="paciente" *ngFor="let paciente of listaPacientes">
      <img src="https://placehold.jp/150x150.png" />
      <p class="nome">{{ paciente.nome }}</p>
      <div>
        <p><b>Idade </b></p>
        <p>{{ paciente.dataNascimento | calculoIdade }} anos</p>
        <p><b>Telefone </b></p>
        <p>{{ paciente.telefone }}</p>
        <p><b>Convênio </b></p>
        <p>{{ paciente?.convenio }}</p>
      </div>
      <div>
        <button
          class="btn-normal"
          type="button"
          routerLink="../prontuarios/{{ paciente.id }}"
        >
          Mais detalhes
        </button>
      </div>
    </div>
    <div class="mensagem-erro" *ngIf="resultadoVazio">
      Nenhum paciente encontrado
    </div>
  </div>
</div>
